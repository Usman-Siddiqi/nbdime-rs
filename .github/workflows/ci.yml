name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  parity:
    name: parity ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    # Exact-output parity is established on Linux; macOS and Windows report but do not block yet.
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the oracle (nbdime 4.0.4)
        run: pip install "nbdime==4.0.4" "nbformat==5.11.1" pytest pytest-timeout
      - name: Fetch upstream test notebooks
        run: git clone --depth 1 --branch v4.0.4 https://github.com/jupyter/nbdime.git "$RUNNER_TEMP/nbdime-upstream"
      - run: cargo build --release -p nbdime-cli
      - name: Parity suites
        env:
          NBDIME_UPSTREAM: ${{ runner.temp }}/nbdime-upstream
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            # diff, diff3 and the POSIX tools upstream's renderers and tests call.
            export PATH="$PATH:/c/Program Files/Git/usr/bin"
          fi
          export NBDIME_REF_BIN="$(dirname "$(command -v nbdiff)")"
          export NBDIME_REF_PYTHON="$(command -v python)"
          git config --global user.name ci && git config --global user.email ci@example.com
          # Suite names have no spaces; macOS's bash 3.2 has no mapfile.
          suites=$(grep -v '^\s*#' parity/enabled_suites.txt | sed '/^\s*$/d' | sed 's#^#parity/#')
          python -m pytest -c parity/pytest.ini -p no:tornasync $suites
