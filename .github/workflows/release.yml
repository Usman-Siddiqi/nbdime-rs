name: Release

# Builds and tests the PyPI distributions on every change to the packaging, and publishes them
# to PyPI (trusted publishing) only when a version tag such as v0.1.0 is pushed.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.*"
      - "scripts/build_wheel.py"
      - "scripts/smoke_wheel.py"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "crates/nbdime-py/**"
      - "scripts/build_wheel.py"
      - "scripts/smoke_wheel.py"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  wheels:
    name: wheel ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, zig: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, zig: true }
          - { os: macos-15-intel, target: x86_64-apple-darwin, macos: "10.12" }
          - { os: macos-15, target: aarch64-apple-darwin, macos: "11.0" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: pip install "maturin>=1.9,<2"
      - if: matrix.zig
        run: pip install ziglang cargo-zigbuild
      - run: python scripts/build_wheel.py --target ${{ matrix.target }} ${{ matrix.zig && '--zig' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  unit-tests:
    name: unit tests ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Put diff and diff3 from Git for Windows on PATH
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'C:\Program Files\Git\usr\bin' >> "$GITHUB_PATH"
      - run: cargo test --locked

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "maturin>=1.9,<2"
      - run: maturin sdist -m crates/nbdime-py/Cargo.toml --out dist
      - name: The sdist builds and the module imports
        run: |
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install dist/*.tar.gz
          /tmp/sdist-venv/bin/python -I -c "import nbdime_rs; assert nbdime_rs.diff({'a': 1}, {'a': 2})"
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  test:
    name: test ${{ matrix.os }} py${{ matrix.python }}
    needs: wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - name: Install the wheel for this platform into a fresh environment
        shell: bash
        run: |
          python -m venv venv
          if [ -d venv/Scripts ]; then py=venv/Scripts/python; else py=venv/bin/python; fi
          "$py" -m pip install --no-index --find-links dist nbdime-rs
          echo "PY=$py" >> "$GITHUB_ENV"
      - shell: bash
        run: '"$PY" -I scripts/smoke_wheel.py'

  check:
    name: metadata check (what PyPI will validate)
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - run: pip install twine
      - run: twine check --strict dist/*
      - name: Five wheels and one sdist, all of this version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          ls dist
          test "$(ls dist/nbdime_rs-"$version"-*.whl | wc -l)" = 5
          test -f "dist/nbdime_rs-$version.tar.gz"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist, test, unit-tests, check]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nbdime-rs
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the crate version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, version $version"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
