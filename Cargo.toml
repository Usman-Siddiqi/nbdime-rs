[workspace]
resolver = "2"
members = ["crates/nbdime-core", "crates/nbdime-cli"]
default-members = ["crates/nbdime-core", "crates/nbdime-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "BSD-3-Clause"
repository = "https://github.com/Usman-Siddiqi/nbdime-rs"
authors = ["Usman Siddiqi"]

[workspace.dependencies]
nbdime-core = { path = "crates/nbdime-core" }
indexmap = "2"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
md-5 = "0.10"
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "meta", "perf", "unicode"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 4

[profile.dev]
debug = 1
