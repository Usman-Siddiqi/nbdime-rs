[package]
name = "nbdime-cli"
description = "Command line tools for nbdime-rs: nbdiff, nbshow, nbpatch, nbmerge and git drivers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "nbdime-rs-dev"
path = "src/bin/dev.rs"

[[bin]]
name = "nbdime"
path = "src/bin/nbdime.rs"

[[bin]]
name = "nbdiff"
path = "src/bin/nbdiff.rs"

[[bin]]
name = "nbmerge"
path = "src/bin/nbmerge.rs"

[[bin]]
name = "nbshow"
path = "src/bin/nbshow.rs"

[[bin]]
name = "nbpatch"
path = "src/bin/nbpatch.rs"

[[bin]]
name = "git-nbdiffdriver"
path = "src/bin/git-nbdiffdriver.rs"

[[bin]]
name = "git-nbmergedriver"
path = "src/bin/git-nbmergedriver.rs"

[[bin]]
name = "git-nbdifftool"
path = "src/bin/git-nbdifftool.rs"

[[bin]]
name = "git-nbmergetool"
path = "src/bin/git-nbmergetool.rs"

[dependencies]
nbdime-core.workspace = true
anyhow.workspace = true
libc.workspace = true

[lints]
workspace = true
