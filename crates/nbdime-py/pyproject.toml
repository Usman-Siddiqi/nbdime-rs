[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "nbdime-rs"
description = "Fast engine for diffing and merging Jupyter notebooks, compatible with nbdime 4.0.4"
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Usman Siddiqi" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Framework :: Jupyter",
    "Topic :: Software Development :: Version Control :: Git",
    "Environment :: Console",
    "Operating System :: OS Independent",
]
dynamic = ["version"]
keywords = ["jupyter", "notebook", "diff", "merge", "git", "nbdime"]

[project.urls]
Homepage = "https://github.com/Usman-Siddiqi/nbdime-rs"
Source = "https://github.com/Usman-Siddiqi/nbdime-rs"
Issues = "https://github.com/Usman-Siddiqi/nbdime-rs/issues"

# The published wheels also carry the command line tools: scripts/build_wheel.py stages them and
# builds with `data = "wheel-data"` added here. A build from the sdist has the module only.
[tool.maturin]
